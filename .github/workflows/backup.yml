name: DB backup

# Supabase's free tier has no automated backups — this weekly pg_dump is the
# safety net. Secret SUPABASE_DB_URL must be the SESSION-pooler connection
# string (IPv4, port 5432) — the transaction pooler cannot run pg_dump, and
# the direct host is IPv6-only, which GitHub runners lack.
on:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client 17
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            | gzip > "backup-$(date +%Y%m%d).sql.gz"
          ls -lh backup-*.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup-*.sql.gz
          retention-days: 90
