name: Keep-alive

# Supabase pauses free-tier projects after ~7 days without activity. This
# pings /healthz (which runs a real DB query) every 3 days to stay awake.
# Set the repository variable APP_URL, e.g. https://htbg-tracker.vercel.app
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app (DB query included)
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-delay 20 \
            "${{ vars.APP_URL }}/healthz"
