{% extends "base.html" %}
{% block content %}
<h1>{{ T('admin_title') }}</h1>

<section class="card">
  <h2>{{ T('admin_add_title') }}</h2>
  <p class="muted small-text">{{ T('admin_add_hint') }}</p>
  <form method="post" action="/admin/users" class="filters">
    <label>{{ T('f_ht_user_id') }}
      <input type="number" name="ht_user_id" required min="1">
    </label>
    <label>{{ T('f_login_name') }}
      <input type="text" name="login_name">
    </label>
    <label>{{ T('admin_role') }}
      <select name="role">
        {% for r in roles %}<option value="{{ r }}" {% if r == 'trainer' %}selected{% endif %}>{{ T('role_' + r) }}</option>{% endfor %}
      </select>
    </label>
    <button class="btn primary" type="submit">{{ T('admin_add_btn') }}</button>
  </form>
</section>
<table>
  <tr><th>{{ T('name') }}</th><th>HT ID</th><th>{{ T('admin_role') }}</th><th></th></tr>
  {% for u in users %}
  <tr>
    <td>{{ u.login_name }}</td>
    <td>{{ u.ht_user_id }}</td>
    <td colspan="2">
      <form method="post" action="/admin/roles" class="inline">
        <input type="hidden" name="user_id" value="{{ u.id }}">
        <select name="role">
          {% for r in roles %}
          <option value="{{ r }}" {% if u.role == r %}selected{% endif %}>{{ T('role_' + r) }}</option>
          {% endfor %}
        </select>
        <button class="btn small" type="submit">{{ T('admin_save') }}</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
